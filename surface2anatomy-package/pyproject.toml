[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "surface2anatomy"
version = "0.1.3"
description = "Target-conditioned 3D internal anatomy localization from external body surface geometry."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [
    { name = "Khushi Mhamane", email = "khushimhamane@gmail.com" },
    { name = "Sharon Melhi", email = "sharonmelhi365@gmail.com" },
    { name = "Deepak Raina", email = "deepakraina@iitmandi.ac.in" }
]
maintainers = [
    { name = "Khushi Mhamane", email = "khushimhamane@gmail.com" }
]
keywords = [
    "deep-learning", "pytorch", "point-cloud", "medical-imaging",
    "anatomy", "3d-vision", "pointnet2", "transformers"
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Healthcare Industry",
    "Topic :: Scientific/Engineering :: Medical Science Apps.",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "numpy>=1.24.0",
    "scipy>=1.10.0",
    "torch>=2.0.0",
    "trimesh>=3.20.0",
    "platformdirs>=3.0.0",
    "requests>=2.28.0",
    "tqdm>=4.65.0",
    "pandas>=2.0.0",
    "scikit-learn>=1.2.0",
    "joblib>=1.2.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "build>=1.0.0",
    "twine>=4.0.0"
]
viz = [
    "matplotlib>=3.7.0"
]

[project.scripts]
surface2anatomy = "surface2anatomy.cli:main"

[project.urls]
Homepage = "https://web-self-theta-51.vercel.app"
Documentation = "https://github.com/Sharon-codes/S2A-Net-IIT-Mandi#readme"
Repository = "https://github.com/Sharon-codes/S2A-Net-IIT-Mandi"
"Bug Tracker" = "https://github.com/Sharon-codes/S2A-Net-IIT-Mandi/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/surface2anatomy"]

[tool.hatch.build.targets.sdist]
include = [
    "/src",
    "/README.md",
    "/LICENSE",
    "/pyproject.toml"
]
